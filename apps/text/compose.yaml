x-ollama-url: &ollama-url http://ollama:11434

name: local-ai-chat-text

services:
  # `mise run text:code` から使う
  aider:
    image: paulgauthier/aider:v0.86.2@sha256:0d54037f6c97c85a926ebc3c903e27446f5bca96823d9f68902f1e623289b556
    volumes:
      - ${MOUNT_DIR:-../..}:/app
    environment:
      OLLAMA_API_BASE: *ollama-url
      AIDER_MODEL: "ollama_chat/${DEFAULT_MODEL:-qwen35-4b-heretic:latest}"
    working_dir: /app
    profiles: [aider]

  ollama:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
    volumes:
      - ../../data/text/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # models.txt のモデルを pull してエイリアスを付ける。起動ごとに再実行され、
  # 失敗したモデルがあると非 0 で終了する。Web UI はこの完了を待たない
  ollama-init:
    image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754 # ollama と同じバージョンにする
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - .:/config:ro
      # pull したモデルの digest を照合するために ollama サービスの manifest を読む (manifest の実体は blobs にある)
      - ../../data/text/ollama/models:/models:ro
    environment:
      OLLAMA_HOST: *ollama-url
    entrypoint: [
      "sh",
      "/config/pull-models.sh",
      "/config/models.txt",
      "/models",
    ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ../../data/text/open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: *ollama-url
      WEBUI_AUTH: "${WEBUI_AUTH:-false}"
      # 未設定なら初回起動時に自動生成され、データボリューム内のこのファイルに保存される
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      DEFAULT_MODELS: "${DEFAULT_MODEL:-qwen35-4b-heretic:latest}"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    # image アプリの ComfyUI へ画像生成を頼むため、アプリ間の共有 network にも入る
    networks: [default, shared]
    restart: unless-stopped

# アプリの間をつなぐ network。どのアプリも単独で起動・停止できるよう、どの project にも属させず、
# `mise run up` が無ければ作る (project が作ると、その project の down が使用中の network を消そうとする)
networks:
  shared:
    name: local-ai-chat
    external: true

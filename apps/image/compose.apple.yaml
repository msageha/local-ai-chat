# Apple Silicon の macOS で、ComfyUI をコンテナではなくホスト (`mise run serve image`) で動かす override。
# `mise run up image apple` が compose.yaml に重ねる。コンテナからは Metal (GPU) を使えないため、
# comfyui サービスをホストの ComfyUI への HTTP リバースプロキシに置き換え、Open WebUI からの接続先 (http://comfyui:8188) を保つ。
# ホストへは host.docker.internal で届く (Docker Desktop と OrbStack が提供する)
services:
  comfyui:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    build: !reset null
    deploy: !reset null
    volumes: !reset []
    # ホストの ComfyUI が同じポートを使うので、ホストには公開しない
    ports: !reset []
    command: [
      "caddy",
      "reverse-proxy",
      "--from",
      ":8188",
      "--to",
      "host.docker.internal:${IMAGE_PORT:-8188}",
      "--change-host-header",
    ]
    healthcheck:
      test: [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:8188/system_stats",
      ]

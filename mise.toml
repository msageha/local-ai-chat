# exact version で pin し、latest にしない (Renovate が mise.lock と合わせて更新する)。
# 手で変えたら `mise lock` で mise.lock を追従させる。
[tools]
prek = "0.5.9"
actionlint = "1.7.12"
dprint = "0.64.3"
gitleaks = "8.30.1"
# apps/text/update-digests.sh が manifest を検証するのに使う
jq = "1.8.2"
# actionlint は PATH に shellcheck があるときだけ run: を検査するため、ローカルと CI で揃えて pin する
shellcheck = "0.11.0"
zizmor = "1.32.0"
typos = "1.52.2"
# Apple Silicon の構成 (apps/text/compose.apple.yaml) でホストに動かす Ollama。MLX は Apple Silicon の macOS でしか動かないので、そこにだけ入れる。
# apps/text/compose.yaml の ollama/ollama イメージと同じバージョンにする
ollama = { version = "0.40.17", os = ["macos/arm64"] }
# Apple Silicon の構成で、ホストに ComfyUI の依存と Python を入れる (apps/shared/comfyui/serve.sh)
uv = { version = "0.13.9", os = ["macos/arm64"] }

[hooks]
postinstall = "prek install"

[settings]
lockfile = true

# compose に渡す設定。未設定の項目は各アプリの compose.yaml の既定値が使われる。
# 変えるときは行のコメントを外す。手元だけの値と secret は、git 管理外の mise.local.toml の [env] に書く。
# [env] の値はシェルの環境変数より優先されるので、実行ごとにシェルから渡す変数 (MODEL・MOUNT_DIR) はここに書かない
[env]
# 設定の置き場を [env] に一本化する。Compose が .env も読むと、[env] で既定に戻したつもりの値 (BIND_HOST=0.0.0.0 など) が .env から効く
COMPOSE_DISABLE_ENV_FILE = "1"
# 各アプリの compose.yaml の name: で project を分けるので、シェルの COMPOSE_PROJECT_NAME で 1 つの project にまとめさせない
COMPOSE_PROJECT_NAME = false
# ポートを bind するホスト側アドレス。同じネットワークに公開するなら 0.0.0.0
# BIND_HOST = "127.0.0.1"
# OLLAMA_PORT = "11434"
# WEBUI_PORT = "3000"
# image と video のアプリの ComfyUI
# IMAGE_PORT = "8188"
# VIDEO_PORT = "8189"
# ログイン画面を有効にするなら true (false だと接続できる誰でも管理者として使える)。ユーザー登録後は false に戻せない
# WEBUI_AUTH = "false"
# 未設定なら初回起動時に自動生成して data/text/open-webui/.webui_secret_key に保存する。
# [env] の値は mise 経由で動かすすべてのコマンドに渡るので、鍵を指定する必要があるときだけ mise.local.toml に書く
# WEBUI_SECRET_KEY = "<secret>"
# Web UI と aider の既定モデル。apps/text/models.txt のエイリアスをタグ付きで指定する。
# Web UI 側は初回起動時にだけ読み込まれ、以後は管理画面の設定が優先される
# DEFAULT_MODEL = "qwen35-4b-heretic:latest"

# 構成は起動のタスクで選ぶので、シェルの COMPOSE_FILE や compose.override.yaml を拾わないよう compose ファイルを明示する (ほかのタスクも同じ)
[tasks.up]
description = "アプリ (text・image・video) を起動する"
usage = '''
arg "<app>" help="text (LLM・Open WebUI・aider)・image (画像生成)・video (動画生成)" {
  choices "text" "image" "video"
}
arg "[setup]" help="cpu (GPU を使わない。text だけ)・gpu (NVIDIA GPU)・apple (Apple Silicon の Mac の GPU)" default="cpu" {
  choices "cpu" "gpu" "apple"
}
long_about "アプリ (text・image・video) を起動する。アプリはそれぞれ単独で起動・停止できる。\n\napple の構成では、先に別の端末で `mise run serve <app>` を実行しておく。手順と制約は README の「Apple Silicon の Mac で GPU を使う」にある。"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
app=$usage_app
setup=$usage_setup
files=(-f "apps/$app/compose.yaml")
options=()
services=()
case $app/$setup in
text/cpu) ;;
# ComfyUI のイメージはローカルで build するので、毎回 build を求めて COMFYUI_VERSION などの更新を反映する (変化が無ければ cache で済む)
image/gpu | video/gpu) options=(--build) ;;
text/gpu | text/apple | image/apple) files+=(-f "apps/$app/compose.$setup.yaml") ;;
# ComfyUI はホスト (`mise run serve video`) で動かす。Open WebUI からは呼ばないので転送も置かず、モデルの取得だけを動かす
video/apple) services=(comfyui-init) ;;
*)
  echo "$app does not support $setup; use gpu or apple" >&2
  exit 1
  ;;
esac
# video は共有 network に入らない
if [[ $app != video ]]; then
  scripts/create-shared-network.sh
fi
# bash 3.2 (macOS の /bin/bash) は、set -u の下で空の配列の展開をエラーにする
docker compose "${files[@]}" up -d ${options[@]+"${options[@]}"} ${services[@]+"${services[@]}"}
'''

[tasks.serve]
description = "Apple Silicon の構成で、アプリの Ollama か ComfyUI をホストで起動する (`mise run up <app> apple` の前に別の端末で実行し、Ctrl-C で止める)"
usage = '''
arg "<app>" {
  choices "text" "image" "video"
}
'''
run = '''
case $usage_app in
text) exec apps/text/serve.sh ;;
*) exec apps/shared/comfyui/serve.sh "$usage_app" ;;
esac
'''

[tasks.down]
description = "アプリを停止する (省略するとすべてのアプリ)"
usage = '''
arg "[app]" {
  choices "text" "image" "video"
}
'''
run = '''
# 1 つのアプリの停止に失敗しても、残りのアプリを止める
status=0
for app in ${usage_app:-text image video}; do
  docker compose -f "apps/$app/compose.yaml" down || status=1
done
exit $status
'''

[tasks.logs]
description = "アプリのログを追従表示する"
usage = '''
arg "<app>" {
  choices "text" "image" "video"
}
'''
run = 'docker compose -f "apps/$usage_app/compose.yaml" logs -f'

[tasks.ui]
description = "アプリの Web UI (text は Open WebUI、image と video は ComfyUI) をブラウザで開く"
usage = '''
arg "<app>" {
  choices "text" "image" "video"
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
url=$(scripts/app-url.sh "$usage_app")
# 同じポートの別のサービスを開かないよう、そのアプリのサーバーだけが返す API で確かめる
case $usage_app in
text) check=/api/config ;;
*) check=/system_stats ;;
esac
# ローカルの UI への疎通なので、ユーザーの .curlrc や proxy の設定を使わない
if ! curl -q --noproxy '*' -fsS -o /dev/null --max-time 5 "$url$check"; then
  echo "$usage_app is not responding at $url; start it with 'mise run up $usage_app <setup>' (and 'mise run serve $usage_app' for apple) first" >&2
  exit 1
fi
open "$url" 2>/dev/null || xdg-open "$url" 2>/dev/null || echo "$url"
'''

[tasks.pull]
description = "アプリの models.txt のモデルを取得する"
usage = '''
arg "<app>" {
  choices "text" "image" "video"
}
long_about "アプリの models.txt のモデルを取得する。\n\nアプリの起動時にも同じ処理が走る。起動したまま models.txt に追加・変更したモデルを取り込むときに使う (行を消したモデルは消えない)。text は先に `mise run up text [gpu|apple]` で起動しておく (起動中の構成で動く)。image と video は起動していなくても取得できる。"
'''
run = '''
case $usage_app in
text) exec apps/text/compose-running.sh run --rm --no-deps ollama-init ;;
image)
  # image の compose.yaml は共有 network を宣言しており、Compose は run でもその存在を確かめるので、up と同じく用意する
  scripts/create-shared-network.sh
  exec docker compose -f apps/image/compose.yaml run --rm --no-deps comfyui-init
  ;;
video) exec docker compose -f apps/video/compose.yaml run --rm --no-deps comfyui-init ;;
esac
'''

# Apple Silicon の構成では ollama サービスがプロキシになり ollama コマンドを持たないので、ollama-init のイメージで問い合わせる
[tasks."text:models"]
description = "text アプリの Ollama に登録済みの LLM を一覧する"
usage = '''
long_about "text アプリの Ollama に登録済みの LLM を一覧する。\n\n先に `mise run up text [gpu|apple]` で起動しておく。起動中の構成で動く。"
'''
run = "apps/text/compose-running.sh run --rm --no-deps --entrypoint ollama ollama-init list"

[tasks."text:digests"]
description = "apps/text/models.txt の digest を各 tag が今指す manifest に更新する (digest の無い行には追記する)"
usage = '''
long_about "apps/text/models.txt の digest を各 tag が今指す manifest に更新する (digest の無い行には追記する)。\n\nLLM を追加・変更したときに使う。手順は docs/models.md の「LLM を追加する」にある。既存のモデルの digest は Renovate が更新する。"
'''
run = "apps/text/update-digests.sh"

[tasks."image:connect-webui"]
description = "Open WebUI の画像生成を image アプリの ComfyUI につなぐ"
usage = '''
long_about "Open WebUI の画像生成を image アプリの ComfyUI につなぐ。\n\n先に `mise run up text [gpu|apple]` で Open WebUI を起動しておく。image アプリは後から起動してもよい。設定は Open WebUI の DB に残るので、一度実行すればよい (apps/image/open-webui.json を変えたときは再び実行する)。Open WebUI のログインを有効にしているなら、管理者のメールアドレスとパスワードの入力を求める。"
'''
run = "apps/image/connect-open-webui.sh"

# aider はホストの UID/GID で実行し、マウント先に作るファイルの所有者をホストユーザーに揃える。
# compose は相対パスを apps/text/ を基準に解くので、MOUNT_DIR はこのリポジトリの直下を基準に絶対パスにして渡す
[tasks."text:code"]
description = "aider でコードを編集する (MOUNT_DIR で対象のディレクトリ、MODEL でモデルを指定する)"
usage = '''
long_about "aider でコードを編集する。aider は git と連携するが、変更を自動では commit しない。\n\n既定ではこのリポジトリを開く。ほかのディレクトリは `MOUNT_DIR=/path/to/project mise run text:code` のように指定する (相対パスはこのリポジトリの直下が基準)。モデルは `MODEL=goetia mise run text:code` のように apps/text/models.txt のエイリアスで指定し、省略すると設定の `DEFAULT_MODEL` を使う。`--` 以降の引数は aider に渡す (例: `mise run text:code -- --no-git`)。\n\n先に `mise run up text [gpu|apple]` で起動しておく。起動中の構成で動く。"
'''
run = "dir=$(CDPATH='' cd -- \"${MOUNT_DIR:-.}\" && pwd) && MOUNT_DIR=$dir exec apps/text/compose-running.sh run --rm --no-deps --user \"$(id -u):$(id -g)\" ${MODEL:+-e AIDER_MODEL=ollama_chat/$MODEL} aider --no-auto-commits --no-dirty-commits"

[tasks.docs]
description = "README.md のタスク一覧を mise.toml と同期する"
run = "mise generate task-docs --inject --output README.md"

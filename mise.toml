# exact version で pin し、latest にしない (Renovate が mise.lock と合わせて更新する)。
# 手で変えたら `mise lock` で mise.lock を追従させる。
[tools]
prek = "0.5.9"
actionlint = "1.7.12"
dprint = "0.64.3"
gitleaks = "8.30.1"
# ollama/update-digests.sh が manifest を検証するのに使う
jq = "1.8.2"
# actionlint は PATH に shellcheck があるときだけ run: を検査するため、ローカルと CI で揃えて pin する
shellcheck = "0.11.0"
zizmor = "1.32.0"
typos = "1.52.2"
# dclint は macOS 向けのバイナリを配布していないので npm から入れる。npm の backend が使う node も揃えて pin する
node = "26.13.1"
"npm:dclint" = "3.1.0"

[hooks]
postinstall = "prek install"

[settings]
lockfile = true

[tasks.up]
description = "全サービスを起動する。モデルの pull はバックグラウンドで進む (`mise run logs` で確認)"
run = "docker compose up -d"

[tasks.down]
description = "全サービスを停止する"
run = "docker compose down"

[tasks.logs]
description = "ログを追従表示する"
run = "docker compose logs -f"

[tasks.ui]
description = "Web UI をブラウザで開く"
run = '''
port=$(docker compose port open-webui 8080) || { echo "open-webui is not running; run 'mise run up' first" >&2; exit 1; }
url="http://localhost:${port##*:}"
open "$url" 2>/dev/null || xdg-open "$url" 2>/dev/null || echo "$url"
'''

[tasks.models]
description = "Ollama に登録済みのモデルを一覧する"
run = "docker compose exec ollama ollama list"

[tasks.pull]
description = "ollama/models.txt のモデルを pull してエイリアスを更新する"
run = "docker compose run --rm ollama-init"

[tasks.digests]
description = "ollama/models.txt の digest を各 tag が今指す manifest に更新する (digest の無い行には追記する)"
run = "ollama/update-digests.sh"

# cli はホストの UID/GID で実行し、マウント先に作るファイルの所有者をホストユーザーに揃える
[tasks.chat]
description = "aider でチャットする (環境変数 MODEL にエイリアスを指定するとモデルを切り替えられる)"
run = "docker compose run --rm --user \"$(id -u):$(id -g)\" ${MODEL:+-e AIDER_MODEL=ollama_chat/$MODEL} cli --no-git --map-tokens 0"

[tasks.code]
description = "MOUNT_DIR のコードを aider で編集する (環境変数 MODEL でモデルを切り替え、`--` 以降は aider に渡す)"
run = "docker compose run --rm --user \"$(id -u):$(id -g)\" ${MODEL:+-e AIDER_MODEL=ollama_chat/$MODEL} cli --no-auto-commits --no-dirty-commits"

[tasks.shell]
description = "aider コンテナで bash を起動する"
run = "docker compose run --rm --user \"$(id -u):$(id -g)\" --entrypoint bash cli"

[tasks.docs]
description = "README.md のタスク一覧を mise.toml と同期する"
run = "mise generate task-docs --inject --output README.md"

# README.md / CODEOWNERS / mise.lock はリポジトリごとに書き換えるので比較しない (CLAUDE.md はこのリポジトリに置かない)
[tasks.template-diff]
description = "共通ファイルを dope-corp/template の main と比較する"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/template"
files=(
  .editorconfig .gitattributes .gitignore .pre-commit-config.yaml commitlint.config.mjs
  dprint.json mise.toml renovate.json
  .github/PULL_REQUEST_TEMPLATE.md
  .github/ISSUE_TEMPLATE/config.yml .github/ISSUE_TEMPLATE/bug_report.yaml .github/ISSUE_TEMPLATE/feature_request.yaml
  .github/workflows/ci.yaml .github/workflows/claude.yaml .github/workflows/claude-sweep.yaml
)
err="$(mktemp)"
trap 'rm -f "${err}"' EXIT
failed=0
for f in "${files[@]}"; do
  if ! upstream="$(gh api "repos/${repo}/contents/${f}" -H 'Accept: application/vnd.github.raw+json' 2>"${err}")"; then
    # 404 は template に無いファイルなので飛ばす。それ以外 (未認証・通信障害・rate limit) は比較できていないので失敗にする
    if grep -q 'HTTP 404' "${err}"; then
      echo "!! ${f}: not in ${repo} main (skipped)"
    else
      echo "!! ${f}: fetch failed: $(cat "${err}")" >&2
      failed=1
    fi
    continue
  fi
  if [[ ! -f "${f}" ]]; then
    echo "!! ${f}: missing locally"
    continue
  fi
  diff -u --label "template/${f}" --label "${f}" <(printf '%s\n' "${upstream}") "${f}" || true
done
exit "${failed}"
'''

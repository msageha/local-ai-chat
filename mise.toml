# exact version で pin し、latest にしない (Renovate が mise.lock と合わせて更新する)。
# 手で変えたら `mise lock` で mise.lock を追従させる。
[tools]
prek = "0.5.9"
actionlint = "1.7.12"
dprint = "0.64.3"
gitleaks = "8.30.1"
# ollama/update-digests.sh が manifest を検証するのに使う
jq = "1.8.2"
# actionlint は PATH に shellcheck があるときだけ run: を検査するため、ローカルと CI で揃えて pin する
shellcheck = "0.11.0"
zizmor = "1.32.0"
typos = "1.52.2"
# dclint は macOS 向けのバイナリを配布していないので npm から入れる。npm の backend が使う node も揃えて pin する
node = "26.13.1"
"npm:dclint" = "3.1.0"
# Apple Silicon の構成 (compose.apple.yaml) でホストに動かす Ollama。MLX は Apple Silicon の macOS でしか動かないので、そこにだけ入れる。
# compose.yaml の ollama/ollama イメージと同じバージョンにする
ollama = { version = "0.40.17", os = ["macos/arm64"] }

[hooks]
postinstall = "prek install"

[settings]
lockfile = true

# compose に渡す設定。未設定の項目は compose.yaml の既定値が使われる。
# 変えるときは行のコメントを外す。手元だけの値と secret は、git 管理外の mise.local.toml の [env] に書く。
# [env] の値はシェルの環境変数より優先されるので、実行ごとにシェルから渡す変数 (MODEL・MOUNT_DIR) はここに書かない
[env]
# NVIDIA GPU を使うなら compose.gpu.yaml を、Apple Silicon の Mac で Ollama をホストで動かすなら compose.apple.yaml を重ねる
# (README の「Apple Silicon の構成」を参照)
# COMPOSE_FILE = "compose.yaml:compose.gpu.yaml"
# COMPOSE_FILE = "compose.yaml:compose.apple.yaml"
# ポートを bind するホスト側アドレス。同じネットワークに公開するなら 0.0.0.0
# BIND_HOST = "127.0.0.1"
# OLLAMA_PORT = "11434"
# WEBUI_PORT = "3000"
# ログイン画面を有効にするなら true (false だと接続できる誰でも管理者として使える)。ユーザー登録後は false に戻せない
# WEBUI_AUTH = "false"
# 未設定なら初回起動時に自動生成して data/open-webui/.webui_secret_key に保存する。
# [env] の値は mise 経由で動かすすべてのコマンドに渡るので、鍵を指定する必要があるときだけ mise.local.toml に書く
# WEBUI_SECRET_KEY = "<secret>"
# Web UI と aider の既定モデル。ollama/models.txt のエイリアスをタグ付きで指定する。
# Web UI 側は初回起動時にだけ読み込まれ、以後は管理画面の設定が優先される
# DEFAULT_MODEL = "qwen35-4b-heretic:latest"

[tasks.up]
description = "全サービスを起動する。モデルの pull はバックグラウンドで進む (`mise run logs` で確認)"
run = "docker compose up -d"

[tasks.serve]
description = "Apple Silicon の構成で、ホストの Ollama を起動する (`mise run up` の前に別のターミナルで実行し、Ctrl-C で止める)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ $(uname -sm) != "Darwin arm64" ]]; then
  echo "serve runs Ollama on the host and needs macOS on Apple Silicon" >&2
  exit 1
fi
# [env] に書いた secret を、長く動き続けるホストの Ollama に引き継がせない
unset WEBUI_SECRET_KEY
# bind 先・ポート・Ollama の設定は compose が決めた値を使い、コンテナで動かすときと揃える
config=$(docker compose config --format json)
if ! jq -e '.services["ollama-init"].environment.PULL_MLX_MODELS == "1"' <<<"$config" >/dev/null; then
  echo "set COMPOSE_FILE to compose.yaml:compose.apple.yaml in the [env] of mise.toml or mise.local.toml so the services connect to the host Ollama" >&2
  exit 1
fi
# compose.apple.yaml の ollama サービスは --to host.docker.internal:<port> へ転送するので、そのポートで待ち受ける
port=$(jq -r '.services.ollama.command | .[index("--to") + 1]' <<<"$config")
port=${port##*:}
bind_host=$(jq -r '.services["open-webui"].ports[0].host_ip' <<<"$config")
# プロキシは host.docker.internal (ホストの loopback) へ転送するので、loopback を含む bind 先だけを受け付ける
case $bind_host in
127.* | ::1 | 0.0.0.0 | ::) ;;
*)
  echo "BIND_HOST=$bind_host is not supported with compose.apple.yaml; use 127.0.0.1 or 0.0.0.0" >&2
  exit 1
  ;;
esac
# IPv6 のアドレスは、ポートと区別できるよう [] で囲む
if [[ $bind_host == *:* ]]; then
  bind_host="[$bind_host]"
fi
mkdir -p data/ollama/models data/ollama/home
# ollama.com の認証鍵は $HOME/.ollama から読まれるので、ホストのユーザーのサインイン状態を引き継がないよう、
# コンテナの ollama と同じくプロジェクトの下に分ける
export HOME="$PWD/data/ollama/home"
# コンテナの ollama と同じモデル置き場を使い、ollama-init がそこで digest を照合できるようにする
export OLLAMA_HOST="$bind_host:$port" OLLAMA_MODELS="$PWD/data/ollama/models"
export OLLAMA_KEEP_ALIVE OLLAMA_MAX_LOADED_MODELS
OLLAMA_KEEP_ALIVE=$(jq -r '.services.ollama.environment.OLLAMA_KEEP_ALIVE' <<<"$config")
OLLAMA_MAX_LOADED_MODELS=$(jq -r '.services.ollama.environment.OLLAMA_MAX_LOADED_MODELS' <<<"$config")
exec ollama serve
'''

[tasks.down]
description = "全サービスを停止する"
run = "docker compose down"

[tasks.logs]
description = "ログを追従表示する"
run = "docker compose logs -f"

[tasks.ui]
description = "Web UI をブラウザで開く"
run = '''
port=$(docker compose port open-webui 8080) || { echo "open-webui is not running; run 'mise run up' first" >&2; exit 1; }
url="http://localhost:${port##*:}"
open "$url" 2>/dev/null || xdg-open "$url" 2>/dev/null || echo "$url"
'''

# Apple Silicon の構成では ollama サービスがプロキシになり ollama コマンドを持たないので、ollama-init のイメージで問い合わせる
[tasks.models]
description = "Ollama に登録済みのモデルを一覧する"
run = "docker compose run --rm --no-deps --entrypoint ollama ollama-init list"

[tasks.pull]
description = "ollama/models.txt のモデルを pull してエイリアスを更新する"
run = "docker compose run --rm ollama-init"

[tasks.digests]
description = "ollama/models.txt の digest を各 tag が今指す manifest に更新する (digest の無い行には追記する)"
run = "ollama/update-digests.sh"

# cli はホストの UID/GID で実行し、マウント先に作るファイルの所有者をホストユーザーに揃える
[tasks.chat]
description = "aider でチャットする (環境変数 MODEL にエイリアスを指定するとモデルを切り替えられる)"
run = "docker compose run --rm --user \"$(id -u):$(id -g)\" ${MODEL:+-e AIDER_MODEL=ollama_chat/$MODEL} cli --no-git --map-tokens 0"

[tasks.code]
description = "MOUNT_DIR のコードを aider で編集する (環境変数 MODEL でモデルを切り替え、`--` 以降は aider に渡す)"
run = "docker compose run --rm --user \"$(id -u):$(id -g)\" ${MODEL:+-e AIDER_MODEL=ollama_chat/$MODEL} cli --no-auto-commits --no-dirty-commits"

[tasks.shell]
description = "aider コンテナで bash を起動する"
run = "docker compose run --rm --user \"$(id -u):$(id -g)\" --entrypoint bash cli"

[tasks.docs]
description = "README.md のタスク一覧を mise.toml と同期する"
run = "mise generate task-docs --inject --output README.md"

# README.md / CODEOWNERS / mise.lock はリポジトリごとに書き換えるので比較しない (CLAUDE.md はこのリポジトリに置かない)
[tasks.template-diff]
description = "共通ファイルを dope-corp/template の main と比較する"
run = '''
#!/usr/bin/env bash
set -euo pipefail
repo="dope-corp/template"
files=(
  .editorconfig .gitattributes .gitignore .pre-commit-config.yaml commitlint.config.mjs
  dprint.json mise.toml renovate.json
  .github/PULL_REQUEST_TEMPLATE.md
  .github/ISSUE_TEMPLATE/config.yml .github/ISSUE_TEMPLATE/bug_report.yaml .github/ISSUE_TEMPLATE/feature_request.yaml
  .github/workflows/ci.yaml .github/workflows/claude.yaml .github/workflows/claude-sweep.yaml
)
err="$(mktemp)"
trap 'rm -f "${err}"' EXIT
failed=0
for f in "${files[@]}"; do
  if ! upstream="$(gh api "repos/${repo}/contents/${f}" -H 'Accept: application/vnd.github.raw+json' 2>"${err}")"; then
    # 404 は template に無いファイルなので飛ばす。それ以外 (未認証・通信障害・rate limit) は比較できていないので失敗にする
    if grep -q 'HTTP 404' "${err}"; then
      echo "!! ${f}: not in ${repo} main (skipped)"
    else
      echo "!! ${f}: fetch failed: $(cat "${err}")" >&2
      failed=1
    fi
    continue
  fi
  if [[ ! -f "${f}" ]]; then
    echo "!! ${f}: missing locally"
    continue
  fi
  diff -u --label "template/${f}" --label "${f}" <(printf '%s\n' "${upstream}") "${f}" || true
done
exit "${failed}"
'''

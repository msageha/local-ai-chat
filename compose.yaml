x-ollama-url: &ollama-url http://ollama:11434

name: local-ai-chat

services:
  # aider。`mise run chat` / `mise run code` / `mise run shell` から使う
  cli:
    image: paulgauthier/aider:v0.86.2@sha256:0d54037f6c97c85a926ebc3c903e27446f5bca96823d9f68902f1e623289b556
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ${MOUNT_DIR:-.}:/app
    environment:
      OLLAMA_API_BASE: *ollama-url
      AIDER_MODEL: "ollama_chat/${DEFAULT_MODEL:-qwen35:latest}"
    working_dir: /app
    profiles: [cli]
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_MAX_LOADED_MODELS: "2"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ollama/models.txt のモデルを pull してエイリアスを付ける。起動ごとに再実行され、
  # 失敗したモデルがあると非 0 で終了する。Web UI はこの完了を待たない
  ollama-init:
    image: ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551 # ollama と同じバージョンにする
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama:/config:ro
      # pull したモデルの digest を照合するために ollama サービスの manifest を読む
      - ./data/ollama/models/manifests:/manifests:ro
    environment:
      OLLAMA_HOST: *ollama-url
    entrypoint: [
      "sh",
      "/config/pull-models.sh",
      "/config/models.txt",
      "/manifests",
    ]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: *ollama-url
      WEBUI_AUTH: "${WEBUI_AUTH:-false}"
      # 未設定なら初回起動時に自動生成され、データボリューム内のこのファイルに保存される
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      DEFAULT_MODELS: "${DEFAULT_MODEL:-qwen35:latest}"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEBUI_PORT:-3000}:8080"
    restart: unless-stopped

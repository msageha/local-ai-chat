x-ollama-url: &ollama-url http://ollama:11434

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ollama/models.txt のモデルを pull してエイリアスを付ける。起動ごとに再実行され、
  # 失敗したモデルがあると非 0 で終了する。Web UI はこの完了を待たない
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama:/config:ro
    environment:
      OLLAMA_HOST: *ollama-url
    entrypoint: ["sh", "/config/pull-models.sh", "/config/models.txt"]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      OLLAMA_BASE_URL: *ollama-url
      WEBUI_AUTH: "${WEBUI_AUTH:-false}"
      # 未設定なら初回起動時に自動生成され、データボリューム内のこのファイルに保存される
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:-}"
      WEBUI_SECRET_KEY_FILE: /app/backend/data/.webui_secret_key
      DEFAULT_MODELS: "${DEFAULT_MODEL:-qwen25:latest}"
    restart: unless-stopped

  # aider。`mise run chat` / `mise run code` / `mise run shell` から使う
  cli:
    image: paulgauthier/aider:latest
    profiles: [cli]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - "${MOUNT_DIR:-.}:/app"
    working_dir: /app
    environment:
      OLLAMA_API_BASE: *ollama-url
      AIDER_MODEL: "ollama_chat/${DEFAULT_MODEL:-qwen25:latest}"
    stdin_open: true
    tty: true

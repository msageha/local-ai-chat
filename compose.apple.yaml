# dclint disable require-project-name-field
# プロジェクト名は重ねる先の compose.yaml が決めるので、この override には書かない
# Apple Silicon の macOS で、Ollama をコンテナではなくホスト (`mise run serve`) で動かす override。
# mise.toml の [env] の COMPOSE_FILE で compose.yaml に重ねる。コンテナからは Metal (GPU) と MLX を使えないため、
# ollama サービスをホストの Ollama への HTTP リバースプロキシに置き換える。接続先の URL (http://ollama:11434) を
# 変えないので、Open WebUI が初回起動時に DB に保存した接続先も、そのまま使える。
# ホストへは host.docker.internal で届く (Docker Desktop と OrbStack が提供する)。ループバックで待ち受ける Ollama は
# localhost や .internal などで終わる名前以外の Host ヘッダーを 403 で拒むので、Host を転送先の名前に書き換える
services:
  # compose.yaml の environment (OLLAMA_KEEP_ALIVE など) は Caddy では使わず、`mise run serve` がホストの Ollama の設定として読む
  ollama:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    volumes: !reset []
    # ホストの Ollama が同じポートを使うので、ホストには公開しない
    ports: !reset []
    command: [
      "caddy",
      "reverse-proxy",
      "--from",
      ":11434",
      "--to",
      "host.docker.internal:${OLLAMA_PORT:-11434}",
      "--change-host-header",
    ]
    # プロキシの先のホストの Ollama が応答するまで、ほかのサービスを待たせる
    healthcheck:
      test: [
        "CMD",
        "wget",
        "-q",
        "-O",
        "/dev/null",
        "http://127.0.0.1:11434/api/version",
      ]

  ollama-init:
    environment:
      # ホストの Ollama は MLX を使えるので、models.txt で mlx を要求するモデルも pull する
      PULL_MLX_MODELS: "1"

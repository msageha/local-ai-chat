# commitlint を commit-msg stage で動かすため、commit-msg hook も導入する
default_install_hook_types:
  - pre-commit
  - commit-msg
# stages 未指定の hook は導入した全 hook type で走るため、commit-msg stage で重ねて走らないよう限定する
default_stages:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system
  - repo: local
    hooks:
      - id: shellcheck
        name: Lint shell scripts with shellcheck
        language: system
        entry: mise exec -- shellcheck
        types: [shell]
      - id: dclint
        name: Lint compose files with dclint
        language: system
        # --max-warnings 0: キーの並び順などの warning も失敗にする
        entry: mise exec -- dclint --max-warnings 0 compose.yaml compose.gpu.yaml
        # 設定 (.dclintrc) だけの変更でも検査し直す
        files: ^(compose(\.gpu)?\.yaml|\.dclintrc)$
        pass_filenames: false
      - id: compose-config
        name: Validate compose files
        language: system
        entry: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
        files: ^compose(\.gpu)?\.yaml$
        pass_filenames: false
      - id: zizmor
        name: Audit GitHub Actions workflows with zizmor
        language: system
        # --offline: リリース情報の解決に GitHub API を使わせない
        entry: mise exec -- zizmor --offline .github/workflows
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: typos
        name: Check spelling with typos
        language: system
        entry: mise exec -- typos
        pass_filenames: false
      - id: mise-task-docs
        name: Sync task docs into README.md
        language: system
        entry: mise run docs
        files: ^mise\.toml$
        pass_filenames: false
      - id: dprint-fmt
        name: Format json/yaml/markdown/toml with dprint
        language: system
        # --allow-no-files: 渡されたファイルがすべて dprint.json の excludes に当たるとき
        # (mise.lock だけの commit 等) に exit 14 (No files found) で失敗しないようにする
        entry: mise exec -- dprint fmt --allow-no-files
        types_or: [json, yaml, markdown, toml]
      # CI の gitleaks job は commit 後の検知なので、commit 前に止めるのはこの hook が担う
      - id: gitleaks
        name: Scan staged changes for secrets with gitleaks
        language: system
        entry: mise exec -- gitleaks git --pre-commit --redact --staged --verbose
        pass_filenames: false
      - id: commitlint
        name: Lint commit message with commitlint
        # language: node なので prek が node と依存を隔離環境に入れる。リポジトリに node は要らない
        language: node
        additional_dependencies:
          ["@commitlint/cli@21.2.4", "@commitlint/config-conventional@21.2.4"]
        entry: commitlint --edit
        stages: [commit-msg]

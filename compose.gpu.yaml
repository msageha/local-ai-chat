# dclint disable require-project-name-field
# プロジェクト名は重ねる先の compose.yaml が決めるので、この override には書かない
# NVIDIA GPU を ollama に割り当てる override。`mise run up:gpu` が compose.yaml に重ねる
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
